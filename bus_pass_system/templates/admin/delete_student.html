{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <div class="mb-3">
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left-circle-fill"></i> Kthehu ne Panel
        </a>
    </div>

    <div class="card p-4 shadow-sm border-danger">
        <h2 class="text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Fshi Studentin</h2>

        <p class="mt-3">
            A je i sigurt që dëshiron ta fshish këtë student:
        </p>

        <h5 class="fw-bold">
            {{ student.first_name }} {{ student.last_name }}
        </h5>

        <form method="post" class="mt-4">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Konfirmo Fshirjen
            </button>

            <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </form>
    </div>

</div>

{% endblock %}
